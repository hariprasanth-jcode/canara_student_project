name: Host Live Spring Boot on GitHub Action Cloud

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  host-live:
    name: Run & Host Spring Boot with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 360

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: canara
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Install Cloudflare Tunnel Client
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start Spring Boot Application in Background
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Launching $JAR_FILE on port 8080..."
          nohup java -jar $JAR_FILE > spring_app.log 2>&1 &
          sleep 12
          cat spring_app.log | tail -n 25

      - name: Create Public HTTPS Tunnel & Expose Application
        run: |
          echo "Starting Cloudflare Tunnel to port 8080..."
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 12
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "=================================================="
          echo "🌐 LIVE PUBLIC URL: $TUNNEL_URL"
          echo "=================================================="
          
          # Create an issue with the live URL so the user can easily see it
          curl -s -X POST https://api.github.com/repos/${{ github.repository }}/issues             -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             -H "Accept: application/vnd.github+json"             -d '{"title": "🌐 Live Spring Boot App URL: '"$TUNNEL_URL"'", "body": "Your Spring Boot + PostgreSQL app is running live!

**Live URL**: '"$TUNNEL_URL"'

Click the link above to use the app in your browser."}' || true

      - name: Keep Server Running & Stream Live Logs
        run: |
          echo "Server is live! Streaming Spring Boot logs..."
          tail -f spring_app.log
