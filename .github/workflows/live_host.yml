name: Host Live Spring Boot on GitHub Action Cloud

on:
  workflow_dispatch: # Trigger manually from GitHub or mobile
  push:
    branches: [ "main" ]

jobs:
  host-live:
    name: Run & Host Spring Boot with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Max allowed runtime (6 hours)

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: canara
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Application
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Install Cloudflare Tunnel Client
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared

      - name: Start Spring Boot Application in Background
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Launching $JAR_FILE on port 8080..."
          nohup java -jar $JAR_FILE > spring_app.log 2>&1 &
          sleep 12
          cat spring_app.log | tail -n 25

      - name: Create Public HTTPS Tunnel & Expose Application
        run: |
          echo "Starting Cloudflare Tunnel to port 8080..."
          cloudflared tunnel --url http://localhost:8080 > tunnel.log 2>&1 &
          sleep 10
          TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9.]*\.trycloudflare\.com' tunnel.log | head -n 1)
          echo "=================================================="
          echo "🌐 LIVE PUBLIC URL: $TUNNEL_URL"
          echo "=================================================="
          echo "### 🌐 Live Spring Boot Application is Running!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Live Public URL**: [$TUNNEL_URL]($TUNNEL_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Database**: PostgreSQL 15 (Active & Connected)" >> $GITHUB_STEP_SUMMARY
          echo "- **Port**: 8080 -> HTTPS Public Tunnel" >> $GITHUB_STEP_SUMMARY
          echo "- **Credentials**: Basic Auth: `admin` / `admin1234`" >> $GITHUB_STEP_SUMMARY

      - name: Keep Server Running & Stream Live Logs
        run: |
          echo "Server is live! Streaming Spring Boot logs..."
          tail -f spring_app.log
