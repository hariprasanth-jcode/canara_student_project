name: Spring Boot CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-package:
    name: Build & Package Spring Boot JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permissions for Maven Wrapper
        run: chmod +x mvnw

      - name: Build Application with Maven
        run: ./mvnw clean package -DskipTests

      - name: Locate Generated JAR
        id: find_jar
        run: |
          JAR_FILE=$(ls target/*.jar | grep -v 'original' | head -n 1)
          echo "Found JAR: $JAR_FILE"
          echo "jar_path=$JAR_FILE" >> $GITHUB_OUTPUT

      - name: Upload Runnable JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: canara-student-project-production-jar
          path: ${{ steps.find_jar.outputs.jar_path }}
          retention-days: 30

      - name: Build Summary
        run: |
          echo "### 🚀 Spring Boot Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version**: JDK 17 (Temurin)" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Spring Boot" >> $GITHUB_STEP_SUMMARY
          echo "- **Production JAR**: Generated and uploaded to artifacts" >> $GITHUB_STEP_SUMMARY
